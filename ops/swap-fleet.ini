# swap-fleet.ini - the demo fleet for the production->pool handoff
# (owner-specified: 27B + gemma, plus Qwen-Drive-4B "in a different class").
#
# 27B params captured LIVE from the current production child on 2026-11-08
# (it is serving the owner's active session - 160k-token context - so these
# must be replicated exactly, ctx included).
# gemma/4B params are the owner's known-good tuned values from the earlier
# production fleet (the current preset has no sections for them).
#
# Class mapping (swap-to-demo.sh heuristic, all verified against these
# aliases): 27B + gemma -> pool-text-md (two-member class),
# Qwen-Drive-4B (image-capable) -> pool-image-text-xs (owner decision
# 2026-11-08: it is a vision model, so it gets its own image-text class).
#
# All three .gguf files verified present in /mnt/data/ai_models at swap time
# (the wrapper preflight re-checks and aborts before killing production if
# not). No downloads: the demo router runs --offline.

[Qwen3.8-27B-Q4_K_M]
# parallel=1 + RAM prompt cache (the production resolution): one slot on the
# GPU at a time, inactive sessions' KV held in system RAM, round-robin across
# concurrent sessions. parallel>4 x full ctx over-commits the KV pool and
# fails mid-generation (see the router's boot check line).
device = Vulkan0
ctx-size = 262144
gpu-layers = 99
fit = off
cache-type-k = q4_0
cache-type-v = q4_0
parallel = 1
kvu = 1
cache-ram = 18165
cache-idle-slots = 1
load-on-startup = 1

[gemma-4-26B-A4B-it-UD-Q6_K]
device = Vulkan2
ctx-size = 262144
gpu-layers = 99
fit = off
cache-type-k = f16
cache-type-v = f16
parallel = 1
kvu = 1
cache-idle-slots = 1
cache-ram = 19152
load-on-startup = 1

[Qwen-Drive-1.0-4B-Q5_K_M]
device = Vulkan1
ctx-size = 32768
gpu-layers = 99
fit = off
cache-type-k = f16
cache-type-v = f16
parallel = 1
kvu = 1
cache-idle-slots = 1
cache-ram = 3868
mmproj = /mnt/data/ai_models/mmproj-Qwen-Drive-1.0-4B-F16.gguf
load-on-startup = 1
